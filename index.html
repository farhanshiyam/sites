@font-face{font-family:'Noto Sans Bengali';font-style:normal;font-weight:100 900;font-display:swap;src:url('/rgce-admin/fonts/noto-sans-bengali-bengali-wght-normal.woff2') format('woff2');unicode-range:U+0951-0952,U+0964-0965,U+0980-09FE,U+1CD0,U+1CD2,U+1CD5-1CD6,U+1CD8,U+1CE1,U+1CEA,U+1CED,U+1CF2,U+1CF5-1CF7,U+200C-200D,U+20B9,U+25CC,U+A8F1}
@font-face{font-family:'Noto Sans Bengali';font-style:normal;font-weight:100 900;font-display:swap;src:url('/rgce-admin/fonts/noto-sans-bengali-latin-ext-wght-normal.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Noto Sans Bengali';font-style:normal;font-weight:100 900;font-display:swap;src:url('/rgce-admin/fonts/noto-sans-bengali-latin-wght-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --primary:#1f4e79; --primary-d:#0f2d4a; --gold:#c9a227;
  --bg:#f3f5f8; --panel:#fff; --text:#1b2430; --muted:#5d6b7a; --border:#d7dde5;
  --input-bg:#fff; --danger:#c62828; --success:#1b7f3b; --warn:#b26a00;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1621; --panel:#16212e; --text:#e6edf5; --muted:#9aa9ba; --border:#2a384a;
    --input-bg:#0f1824; --danger:#ef7b7b; --success:#5fcf86; --warn:#e0a24a; --primary:#4f8fc9;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1621; --panel:#16212e; --text:#e6edf5; --muted:#9aa9ba; --border:#2a384a;
  --input-bg:#0f1824; --danger:#ef7b7b; --success:#5fcf86; --warn:#e0a24a; --primary:#4f8fc9;
}
*{box-sizing:border-box}
/* Copy protection: nothing can be selected except inside input / textarea boxes */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,select{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none}
@media print{body *{display:none!important}}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 "Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:linear-gradient(135deg,#0f2d4a,#1f4e79);color:#fff;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold)}
.top h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
.top small{display:block;opacity:.8;font-size:12.5px;font-weight:400}
.top .right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wrap{max-width:none;margin:0;padding:18px 18px 60px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 20px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:18px}
.card h3{margin:18px 0 8px;font-size:15px}
.muted{color:var(--muted);font-size:13.5px}
.center{max-width:430px;margin:48px auto 0}
.fg{margin:0 0 12px}
.fg label{display:block;font-size:13px;font-weight:600;margin:0 0 4px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg)}
.fg textarea{min-height:96px;resize:vertical}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--primary)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-sm{padding:5px 10px;font-size:13px}
.top .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.top .btn:hover{background:rgba(255,255,255,.22)}
.tab{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-weight:600;font-size:14px}
.tab[aria-selected="true"]{background:var(--primary);color:#fff;border-color:var(--primary)}
.msg{min-height:20px;margin:8px 0;font-size:13.5px;color:var(--danger)}
.msg.ok{color:var(--success)}
.msg.warn{color:var(--warn)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:14px}
.kv b{font-weight:600}
.kv code{font-size:12px;word-break:break-all}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border)}
.row .t{flex:1 1 240px;min-width:0}
.row .t b{display:block;overflow-wrap:anywhere}
.row .t small{color:var(--muted)}
.row .acts{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:11.5px;border:1px solid var(--border);color:var(--muted)}
.chip.on{border-color:var(--success);color:var(--success)}
.chk{display:flex;gap:8px;align-items:flex-start;margin:0 0 14px;font-size:14px}
.chk input{margin-top:4px}
.rules{width:100%;font:12px/1.45 ui-monospace,Consolas,monospace;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);min-height:230px}
.big{font-size:26px;font-weight:700;color:var(--primary)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
.tbl-wrap:empty{display:none}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.tbl th{background:var(--bg);font-size:12.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;white-space:nowrap}
.tbl .dueamt{color:var(--danger);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.stat{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--input-bg)}
.stat small{display:block;color:var(--muted);font-size:12.5px}
.stat b{display:block;font-size:20px;margin-top:2px}
.stat.bad b{color:var(--danger)}
.pill{display:inline-block;padding:2px 12px;border-radius:999px;font-weight:700;font-size:13px;border:1px solid var(--border)}
.pill.on{color:var(--success);border-color:var(--success)}
.pill.off{color:var(--danger);border-color:var(--danger)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

.lnk{background:none;border:0;padding:0;color:var(--primary);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit;font-weight:600;text-align:left}
.lnk:hover{opacity:.8}
.pbar{height:12px;border-radius:999px;background:var(--border);overflow:hidden;margin:6px 0 4px}.pbar>i{display:block;height:100%;border-radius:999px}
/* modals fill the whole screen beside the single sidebar */
.mdl-back{position:fixed;top:0;left:64px;right:0;bottom:0;z-index:45;background:var(--bg)}
body.side-open .mdl-back{left:260px}
@media(max-width:720px){body.side-open .mdl-back{left:64px}}
.mdl{background:var(--panel);color:var(--text);width:100%;height:100%;display:flex;flex-direction:column}
.log-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
.mdl-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}.mdl-h h2{margin:0;font-size:17px}
.mask{-webkit-text-security:disc;text-security:disc;font-family:Verdana,sans-serif;letter-spacing:2px}
.bz-host{margin-top:16px;border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--panel)}.bz-host[hidden]{display:none}

.bz-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;align-items:start}
.bz-t{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;align-items:start}
.bz-st{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
@media(max-width:1100px){.bz-t{grid-template-columns:minmax(0,1fr)}}.mdl-b{padding:16px 18px;overflow:auto}
.mdl-b{flex:1;min-height:0;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.wd{border-collapse:collapse;width:100%;font:14px Calibri,Arial,sans-serif;color:var(--text);background:transparent}.wd th,.wd td{border:1px solid var(--text);padding:4px 8px;text-align:right}.wd th{text-align:center;font-weight:700}.wd th:first-child,.wd td:first-child{text-align:left}.wd tfoot td{font-weight:700}
.bz-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}.bz-in label{display:block;font-size:12.5px;color:var(--muted)}.bz-in input{width:100%}.mdl-b .row .t small{display:block}
/* hamburger + sidebar (standard) */
.top .left{display:flex;align-items:center;gap:12px;min-width:0}
.brand-ic{width:40px;height:40px;flex:none;display:block;border-radius:10px;-webkit-user-drag:none}
.brand-plate{display:flex;justify-content:center;align-items:center;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 16px;margin:0 0 16px}
.brand-plate img{display:block;max-width:100%;height:auto;max-height:70px;width:auto}
.burger{width:42px;height:42px;flex:none;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);cursor:pointer}
.burger[hidden]{display:none}
.burger:hover{background:rgba(255,255,255,.22)}
.burger span{display:block;width:20px;height:2px;border-radius:2px;background:#fff}
.side{position:fixed;top:0;bottom:0;left:0;width:64px;background:var(--panel);color:var(--text);border-right:1px solid var(--border);z-index:50;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;transition:width .2s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
body.has-side .side{display:flex}
body.has-side{padding-left:64px;transition:padding-left .2s ease}
body.has-side .top{display:none}
body.side-open .side{width:260px}
body.side-open.has-side{padding-left:260px}
@media(max-width:720px){body.has-side,body.side-open.has-side{padding-left:64px}body.side-open .side{box-shadow:4px 0 24px rgba(0,0,0,.18)}}
.side .burger{border:1px solid var(--border);background:var(--bg)}
.side .burger span{background:var(--text)}
.side .burger:hover{background:var(--border)}
body:not(.side-open) .side .nav span,body:not(.side-open) .side .sb-title,body:not(.side-open) .side .sb-mail,body:not(.side-open) .sb-logo{display:none}
body:not(.side-open) .side .nav{justify-content:center;padding:10px 0}
body:not(.side-open) .side nav,body:not(.side-open) .sb-foot{padding-left:8px;padding-right:8px}
body:not(.side-open) .sb-head{justify-content:center;padding:12px 0}
body:not(.side-open) .sb-user{margin:0 10px 10px;padding:6px;justify-content:center}
.sb-head{display:flex;align-items:center;gap:10px;padding:16px 14px 12px 16px}
.sb-logo{width:38px;height:38px;flex:none;display:block;border-radius:10px;-webkit-user-drag:none}
.sb-title{flex:1;min-width:0;font-weight:700;font-size:15px;line-height:1.25}
.sb-title small{display:block;font-weight:400;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-close{width:34px;height:34px;flex:none;display:grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer}
.sb-close:hover{background:var(--bg);color:var(--text)}
.sb-user{display:flex;align-items:center;gap:10px;margin:0 12px 10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg)}
.sb-av{width:32px;height:32px;flex:none;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;text-transform:uppercase}
.sb-mail{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.side nav{display:flex;flex-direction:column;gap:2px;padding:4px 10px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:none;color:var(--text);font:inherit;font-weight:500;font-size:14.5px;text-align:left;text-decoration:none;cursor:pointer}
.nav svg{flex:none;color:var(--muted)}
.nav:hover{background:var(--bg)}
.nav.on{background:rgba(31,78,121,.1);background:color-mix(in srgb,var(--primary) 13%,transparent);color:var(--primary);font-weight:600}
.nav.on svg{color:var(--primary)}
.sb-sep{height:1px;background:var(--border);margin:10px 16px;margin-top:auto}
.sb-foot{display:flex;flex-direction:column;gap:2px;padding:0 10px 14px}
.nav.danger,.nav.danger svg{color:var(--danger)}
.burger:focus-visible,.nav:focus-visible,.sb-close:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.side,body.has-side{transition:none}}
/* access key table */
.keytbl{width:100%;border-collapse:collapse;margin:16px 0 8px;border:1px solid var(--border)}
.keytbl th,.keytbl td{padding:10px 12px;border:1px solid var(--border);text-align:left;vertical-align:middle}
.keytbl th{width:36%;background:var(--bg);font-size:13.5px;font-weight:600}
.keytbl input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);letter-spacing:2px}
.keytbl input:focus{outline:2px solid var(--primary);border-color:var(--primary)}
@media(max-width:520px){.kv{grid-template-columns:1fr}.card{padding:16px 14px}}
</style>
</head>

/* Watchdog: a normal (non-module) script, so it still runs when the Firebase module fails to load */
(function () {
  var MSG = {
    sdk:  ['The Firebase scripts did not load. Check your internet, then reload the page.', 'Firebase স্ক্রিপ্ট লোড হয়নি। ইন্টারনেট দেখে পেজ রিলোড করুন।'],
    slow: ['The panel is taking too long to start. Check your internet, then reload the page.', 'প্যানেল চালু হতে অনেক সময় লাগছে। ইন্টারনেট দেখে পেজ রিলোড করুন।'],
    btn:  ['Reload', 'রিলোড']
  };
  window.__bootFail = function (kind) {
    var i = 0; try { i = localStorage.getItem('rgce_lang') === 'bn' ? 1 : 0; } catch (e) {}
    var app = document.getElementById('app'); if (!app) return;
    app.innerHTML = '';
    var card = document.createElement('div'); card.className = 'card center'; card.style.textAlign = 'center';
    var p = document.createElement('p'); p.className = 'msg'; p.textContent = MSG[kind][i];
    var b = document.createElement('button'); b.className = 'btn btn-primary'; b.type = 'button'; b.textContent = MSG.btn[i];
    b.onclick = function () { location.reload(); };
    card.appendChild(p); card.appendChild(b); app.appendChild(card);
  };
  window.addEventListener('online', function () { if (!window.__rgceBooted) location.reload(); });   // internet came back -> try again
  setTimeout(function () {                                   // SDK loaded but startup is stuck: drop this panel's saved session, reload once
    if (window.__rgceBooted || !window.__rgceSdk) return;
    var done = false; try { done = sessionStorage.getItem('rgce_adm_heal') === '1'; } catch (e) {}
    if (done) return;
    try { sessionStorage.setItem('rgce_adm_heal', '1'); Object.keys(sessionStorage).forEach(function (k) { if (k.indexOf('firebase:') === 0) sessionStorage.removeItem(k); }); } catch (e) {}
    location.reload();
  }, 10000);
  setTimeout(function () { if (!window.__rgceBooted) window.__bootFail(window.__rgceSdk ? 'slow' : 'sdk'); }, 24000);
})();

<script type="module">
/* ============ Firebase loader: 2 CDNs, per-try timeout, one automatic page retry ============ */
const SDK_VER = '10.12.0';
const SOURCES = [
  ['https://www.gstatic.com/firebasejs/' + SDK_VER + '/firebase-app.js', 'https://www.gstatic.com/firebasejs/' + SDK_VER + '/firebase-auth.js', 'https://www.gstatic.com/firebasejs/' + SDK_VER + '/firebase-firestore.js'],
  ['https://cdn.jsdelivr.net/npm/firebase@' + SDK_VER + '/app/+esm', 'https://cdn.jsdelivr.net/npm/firebase@' + SDK_VER + '/auth/+esm', 'https://cdn.jsdelivr.net/npm/firebase@' + SDK_VER + '/firestore/+esm']
];
async function loadSdk() {
  let last;
  for (const urls of SOURCES) {
    try {
      const mods = await Promise.race([
        Promise.all(urls.map(u => import(u))),
        new Promise((_, rej) => setTimeout(() => rej(new Error('sdk timeout')), 8000))
      ]);
      return Object.assign({}, ...mods);
    } catch (e) { last = e; console.warn('[sdk] source failed', urls[0], e); }
  }
  throw last;
}
let SDK;
try { SDK = await loadSdk(); window.__rgceSdk = true; }
catch (e) {
  let tried = false;
  try { tried = sessionStorage.getItem('rgce_adm_try') === '1'; if (!tried) sessionStorage.setItem('rgce_adm_try', '1'); } catch (x) {}
  if (!tried) setTimeout(() => location.reload(), 1200);       // first failure: silently reload once (a reload clears a cached failed import)
  else window.__bootFail('sdk');
  throw e;
}

    if (isField(e.target)) return;

  }, true);

    if (isField(document.activeElement)) return;
    const sel = getSelection(); if (!sel || sel.isCollapsed) return;
    const n = sel.anchorNode, el = n && (n.nodeType === 1 ? n : n.parentElement);
    if (!isField(el) && !(el && el.closest && el.closest('input,textarea'))) sel.removeAllRanges();

})();

/* ============ password helpers (identical scheme to the main app: salted PBKDF2 hashes in private_config/<uid>) ============ */
const cfgRef = () => doc(db, 'private_config', user.uid);

/* ---------- modal ---------- */
let mdlClose = null;
function closeModal() { if (mdlClose) mdlClose(); }
document.addEventListener('click', e => { if (mdlClose && e.target.closest && e.target.closest('#side') && !e.target.closest('#menuBtn')) closeModal(); });
function openModal(title, html) {
  closeModal();
  const back = document.createElement('div'); back.className = 'mdl-back';
  back.innerHTML = '<div class="mdl" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="mdl-h"><h2>' + esc(title) + '</h2><button type="button" class="sb-close" id="mdlX" aria-label="' + esc(t('mdlClose')) + '">' + ico('x') + '</button></div><div class="mdl-b" id="mdlB">' + html + '</div></div>';
  document.body.appendChild(back);
  const prev = document.activeElement;
  const onKey = e => { if (e.key === 'Escape') closeModal(); };
  mdlClose = () => { document.removeEventListener('keydown', onKey); back.remove(); mdlClose = null; if (prev && prev.focus) { try { prev.focus(); } catch (x) {} } };
  document.addEventListener('keydown', onKey);
  back.addEventListener('mousedown', e => { if (e.target === back) closeModal(); });
  $('#mdlX').addEventListener('click', closeModal); $('#mdlX').focus();
  return $('#mdlB');
}
/* ---------- admin activity log (kept in private_config/<uid>.adminLog, newest first, max 100) ---------- */
const LOG_MAX = 100;
let LOGQ = [], logTimer = 0;
function logAct(a, d) {
  const now = Date.now(), last = LOGQ[0];
  if (last && last.a === a && now - last.at < 15000 && (a === 'chatDel' || a === 'chatExt' || a === 'notice')) last.n = (last.n || 1) + 1;
  else { const e = { at: now, a: a, d: d == null ? '' : String(d).slice(0, 80) }; LOGQ.unshift(e); }
  clearTimeout(logTimer); logTimer = setTimeout(flushLog, 2000);
}
async function flushLog() {
  clearTimeout(logTimer); if (!LOGQ.length || !user) return;
  const q = LOGQ.splice(0), ref = cfgRef();
  try { const s = await getFresh(ref); const dd = s.exists() ? (s.data() || {}) : {}; const cur = Array.isArray(dd.adminLog) ? dd.adminLog : []; await setDoc(ref, { adminLog: q.concat(cur).slice(0, LOG_MAX) }, { merge: true }); }
  catch (e) { console.warn('activity log', e); LOGQ = q.concat(LOGQ).slice(0, 50); }
}
async function showLog() {
  openModal(t('logH'), '<span class="spin"></span>');
  let list = [], ok = true;
  const load = async () => {
    ok = true;
    try { await flushLog(); const s = await getFresh(cfgRef()); const d = s.exists() ? (s.data() || {}) : {}; list = Array.isArray(d.adminLog) ? d.adminLog : []; }
    catch (e) { console.warn(e); ok = false; }
  };
  const same = (x, y) => x.at === y.at && x.a === y.a && (x.d || '') === (y.d || '');
  const paint = () => {
    const box = $('#mdlB'); if (!box) return;
    const all = LOGQ.map(x => ({ x: x, pend: true })).concat(list.map(x => ({ x: x, pend: false })));
    const row = (o, i) => { const x = o.x; return '<div class="row"><div class="t"><b>' + esc(t('lg_' + x.a)) + ((x.n || 0) > 1 ? ' \u00D7' + x.n : '') + '</b>' + (x.d ? '<small>' + esc(x.d) + '</small>' : '') + (o.pend ? '<small>' + esc(t('logPend')) + '</small>' : '') + '</div>'
      + '<div style="display:flex;align-items:center;gap:10px"><small class="muted">' + esc(fmtDT(x.at)) + '</small><button type="button" class="btn btn-sm btn-danger" data-ld="' + i + '">' + esc(t('logDel')) + '</button></div></div>'; };
    box.innerHTML = '<div class="log-tools"><p class="muted" style="margin:0">' + esc(t('logNote')) + '</p>' + (all.length ? '<button type="button" class="btn btn-sm btn-danger" id="logAll">' + esc(t('logDelAll')) + '</button>' : '') + '</div>'
      + '<div class="msg" id="logM" role="status">' + (ok ? '' : esc(t('logFail'))) + '</div>'
      + (all.length ? all.map(row).join('') : '<div class="row"><span class="muted">' + esc(t('logNone')) + '</span></div>');
    box.querySelectorAll('[data-ld]').forEach(btn => btn.addEventListener('click', async () => {
      const target = all[+btn.getAttribute('data-ld')]; if (!target || !confirm(t('logAskOne'))) return;
      btn.disabled = true;
      try {
        await flushLog(); LOGQ = LOGQ.filter(y => !same(y, target.x));
        const ref = cfgRef(), s = await getFresh(ref), d = s.exists() ? (s.data() || {}) : {};
        const cur = Array.isArray(d.adminLog) ? d.adminLog : [];
        await setDoc(ref, { adminLog: cur.filter(y => !same(y, target.x)) }, { merge: true });
        await load(); paint();
      } catch (e) { console.warn(e); btn.disabled = false; setMsg('logM', t('logDelFail')); }
    }));
    const ab = $('#logAll');
    if (ab) ab.addEventListener('click', async () => {
      if (!confirm(t('logAskAll'))) return;
      ab.disabled = true;
      try {
        clearTimeout(logTimer); LOGQ = [];

function authMsg(e) {
  const c = (e && (e.code || e.message)) || 'unknown';
  console.error('[admin login]', c, e);
  if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/invalid-login-credentials') return t('badLogin');
  if (c === 'auth/user-not-found') return t('noUser');
  if (c === 'auth/invalid-email') return t('badEmail');
  if (c === 'auth/user-disabled') return t('disabled');
  if (c === 'auth/too-many-requests') return t('tooMany');
  if (c === 'auth/network-request-failed' || c === 'timeout') return t('netErr');
  if (/referer/i.test(c)) return t('refBlocked') + ' (' + c + ')';
  if (c === 'auth/unauthorized-domain') return t('badDomain') + ' (' + location.hostname + ')';
  if (c === 'auth/invalid-api-key' || c === 'auth/api-key-not-valid.-please-pass-a-valid-api-key.') return t('badKey');
  return t('failCode') + c;
}
/* ============ access key gate (second step after email + password) ============ */
/* Only a salted SHA-256 hash of the key is stored here, not the key itself. This is a screen lock, not server-side security. */
const KEY_SALT = 'rgce-admin|', KEY_HASH = '0031658ef358e05afcb041e8efdb647d88dfa770a338605cd14403e6cd0ab445';
let unlocked = false, gateFails = 0, gateUntil = 0;
const sessGet = k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
const sessSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} };
const sessDel = k => { try { sessionStorage.removeItem(k); } catch (e) {} };
const bnDigits = v => String(v).replace(/[\u09E6-\u09EF]/g, d => String(d.charCodeAt(0) - 0x09E6));
async function sha256Hex(str) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}
function renderGate() {
  app.innerHTML = '<div class="card center">' + logoPlate() + '<h2>' + esc(t('gateH')) + '</h2><p class="muted">' + esc(t('gateP')) + '</p>'
    + '<table class="keytbl"><tbody><tr><th scope="row"><label for="gkIn">' + esc(t('gateKey')) + '</label></th>'
    + '<td><input id="gkIn" class="mask" name="panel-access-code" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" data-form-type="other"></td></tr></tbody></table>'
    + '<div class="msg" id="gkM" role="status"></div><button class="btn btn-primary" id="gkGo" type="button">' + esc(t('gateBtn')) + '</button></div>';
  const go = async () => {
    if (Date.now() < gateUntil) { setMsg('gkM', t('gateLocked')); return; }
    const v = bnDigits($('#gkIn').value.trim()); if (!v) return;
    const btn = $('#gkGo'); btn.disabled = true; setMsg('gkM', '');
    let ok = false;
    try { ok = (await sha256Hex(KEY_SALT + v)) === KEY_HASH; }
    catch (e) { console.warn(e); btn.disabled = false; setMsg('gkM', t('gateErr')); return; }
    if (ok) { gateFails = 0; unlocked = true; sessSet('rgce_adm_ok', user.uid); logAct('unlock'); openPanel(); return; }
    gateFails++;
    if (gateFails >= 5) { gateFails = 0; logAct('keyFail'); gateUntil = Date.now() + 60000; setMsg('gkM', t('gateLocked')); } else setMsg('gkM', t('gateBad'));
    $('#gkIn').value = ''; btn.disabled = false; $('#gkIn').focus();
  };
  $('#gkGo').addEventListener('click', go);
  $('#gkIn').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  $('#gkIn').focus();
}

async function rptList() {
  const box = $('#rpList'); if (!box) return;
  box.innerHTML = '<h2>' + esc(rl('lH')) + '</h2><p class="muted">' + esc(rl('lNote')) + '</p><div id="rlRows"></div><div class="msg" id="rlMsg" role="status"></div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"><button class="btn btn-sm" id="rlRef">' + esc(rl('rRef')) + '</button><button class="btn btn-sm btn-danger" id="rlExp">' + esc(rl('lDelExp')) + '</button><button class="btn btn-sm btn-danger" id="rlAll">' + esc(rl('lDelAll')) + '</button></div>';
  let list = [];
  const draw = () => {
    const now = Date.now();
    $('#rlRows').innerHTML = list.length ? list.map(x => { const left = Math.ceil(((+x.exp || 0) - now) / 864e5), dead = left <= 0;
      return '<div class="row"><div class="t"><b>' + esc(rl('ty_' + x.ty)) + ' <span class="chip ' + (dead ? '' : 'on') + '">' + esc(dead ? rl('lExpired') : left + ' ' + rl('lDays')) + '</span></b><small>' + esc(rl('cNo')) + ' ' + esc(x.no) + ' \u2022 ' + esc(x.gen) + ' \u2022 ' + (x.n || 0) + ' ' + esc(rl('lRows')) + '</small></div>'
        + '<div class="acts"><a class="btn btn-sm" target="_blank" rel="noopener" href="' + esc(REPORT_VIEW_URL + '?r=' + x.id) + '">' + esc(rl('lOpen')) + '</a><button class="btn btn-sm btn-danger" data-rd="' + esc(x.id) + '">' + esc(rl('lDel')) + '</button></div></div>'; }).join('')
      : '<div class="row"><span class="muted">' + esc(rl('lNone')) + '</span></div>';
  };
  const load = async () => { setMsg('rlMsg', ''); try { list = await rptIdx(); } catch (e) { console.warn(e); setMsg('rlMsg', rl('rFail')); } if ($('#rlRows')) draw(); };
  const drop = async ids => {
    setMsg('rlMsg', ''); const gone = new Set();
    try { for (const id of ids) { await rptKill(id); gone.add(id); } logAct('rpDel', gone.size + ''); setMsg('rlMsg', rl('lDone'), 'ok'); }
    catch (e) { console.warn(e); setMsg('rlMsg', rl('lFail') + ((e && e.code) ? ' (' + e.code + ')' : '')); }
    try { if (gone.size) { const cur = (await rptIdx()).filter(x => !gone.has(x.id)); await rptPut(cur); list = cur; } } catch (e) { console.warn(e); list = list.filter(x => !gone.has(x.id)); }
    if ($('#rlRows')) draw();
  };
  box.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-rd]'); if (b && confirm(rl('lAsk1'))) drop([b.getAttribute('data-rd')]); });
  $('#rlRef').addEventListener('click', load);

  $('#rlAll').addEventListener('click', () => { if (list.length && confirm(rl('lAskN').replace('{n}', list.length))) drop(list.map(x => x.id)); });
  load();
}

const grpOf = (rows, key) => { const m = {}; rows.forEach(r => { const k = r[key] || ''; const g = m[k] || (m[k] = { k, n: 0, d: 0, p: 0, b: 0, c: 0 }); g.n++; g.d += r.due; g.p += r.paid; g.b += r.bal; if (r.bal > 0) g.c++; }); return Object.keys(m).map(k => m[k]); };

    + fld('cmS', rl('cmSort'), '<select id="cmS"><option value="now">' + esc(rl('cmSNow')) + '</option><option value="chg">' + esc(rl('cmSChg')) + '</option></select>') + '</div>'

    + '<style>' + RCSS + '</style><div id="cmOut"></div>';
  let snaps = [], live = null, html = '', name = '';
  const label = s => msStamp(s.at) + ' \u2022 ' + s.tot.n + ' / ' + money(s.tot.b);
  const fill = () => {
    const a = $('#cmA'), b = $('#cmB'), ca = a.value, cb = b.value, opt = s => '<option value="' + s.at + '">' + esc(label(s)) + '</option>';
    a.innerHTML = snaps.map(opt).join(''); b.innerHTML = '<option value="live">' + esc(rl('cmLive')) + '</option>' + snaps.map(opt).join('');
    const d0 = new Date(), pm = new Date(d0.getFullYear(), d0.getMonth() - 1, 1).getTime(), cm = new Date(d0.getFullYear(), d0.getMonth(), 1).getTime();
    const pick = snaps.find(s => s.at >= pm && s.at < cm) || snaps.find(s => s.at < cm) || snaps[0];
    a.value = ca && snaps.some(s => String(s.at) === ca) ? ca : (pick ? String(pick.at) : ''); b.value = cb && (cb === 'live' || snaps.some(s => String(s.at) === cb)) ? cb : 'live';
    $('#cmGo').disabled = !snaps.length || !live; $('#cmDel').disabled = !snaps.length; $('#cmSnap').disabled = !live;
    setMsg('cmMsg', snaps.length ? '' : rl('cmNone'));
  };
  const load = async () => {
    try {
      const [s, c] = await Promise.all([snapIdx(), getFresh(doc(db, 'shops', user.uid))]); const d = c.exists() ? (c.data() || {}) : {};
      snaps = s; live = (Array.isArray(d.customers) ? d.customers : []).map(x => { const due = +x.due || 0, paid = +x.paid || 0; return { due, paid, bal: Math.max(0, due - paid), addr: String(x.address || '').trim(), src: String(x.source == null ? '' : x.source).trim() }; });
      if ($('#cmA')) fill();
    } catch (e) { console.warn(e); setMsg('cmMsg', rl('rFail')); }
  };
  const side = v => v === 'live' ? snapOf(live) : snaps.find(s => String(s.at) === v);
  $('#cmGo').addEventListener('click', () => {
    const A = side($('#cmA').value), B = side($('#cmB').value), g = $('#cmG').value; if (!A || !B) return;
    const ma = {}, mb = {}; (A[g] || []).forEach(x => ma[x.k] = x); (B[g] || []).forEach(x => mb[x.k] = x);
    const rows = Array.from(new Set(Object.keys(ma).concat(Object.keys(mb)))).map(k => ({ k, a: ma[k] ? ma[k].b : 0, b: mb[k] ? mb[k].b : 0, ca: ma[k] ? ma[k].c : 0, cb: mb[k] ? mb[k].c : 0 }));
    rows.sort($('#cmS').value === 'chg' ? (x, y) => (y.b - y.a) - (x.b - x.a) : (x, y) => y.b - x.b);
    const sl = s => s === $('#cmB').value && s === 'live' ? rl('cmLive') + ' (' + msStamp(Date.now()) + ')' : msStamp(+s);
    const gs = stamp(); html = compareHtml({ g, rows, gen: gs, aLabel: sl($('#cmA').value), bLabel: sl($('#cmB').value), ta: A.tot.b, tb: B.tot.b, tca: A.tot.c, tcb: B.tot.c });
    name = 'RGCE-Compare-' + g + '-' + gs.replace(/[: ]/g, '-'); $('#cmOut').innerHTML = '<div style="overflow-x:auto;border-radius:8px">' + html + '</div>'; $('#cmPr').disabled = false;
  });
  $('#cmSnap').addEventListener('click', async () => {
    if (!live) return; setMsg('cmMsg', ''); $('#cmSnap').disabled = true;
    try { const cur = await snapIdx(); cur.unshift(snapOf(live)); await setDoc(cfgRef(), { dcuSnaps: cur.slice(0, SNAP_MAX) }, { merge: true }); logAct('snap'); setMsg('cmMsg', rl('cmSaved'), 'ok'); await load(); }
    catch (e) { console.warn(e); setMsg('cmMsg', rl('lFail') + ((e && e.code) ? ' (' + e.code + ')' : '')); }
    if ($('#cmSnap')) $('#cmSnap').disabled = !live;
  });
  $('#cmDel').addEventListener('click', async () => {
    const v = $('#cmA').value; if (!v || !confirm(rl('cmAsk'))) return; setMsg('cmMsg', '');
    try { const cur = (await snapIdx()).filter(s => String(s.at) !== v); await setDoc(cfgRef(), { dcuSnaps: cur }, { merge: true }); logAct('snapDel'); await load(); setMsg('cmMsg', rl('lDone'), 'ok'); }
    catch (e) { console.warn(e); setMsg('cmMsg', rl('lFail') + ((e && e.code) ? ' (' + e.code + ')' : '')); }
  });
  $('#cmPr').addEventListener('click', () => { if (html) { logAct('cmPrint', name); printHtml(html, name); } });
  load();
}

function mntCard() {

function stopChats() {
  if (CH.unsubList) CH.unsubList(); if (CH.unsubDue) CH.unsubDue(); if (CH.unsubMsgs) CH.unsubMsgs(); clearInterval(CH.timer);
  CH = { list: [], due: [], unread: 0, started: false, err: '', sel: '', msgs: [], q: '', unsubList: null, unsubDue: null, unsubMsgs: null, timer: 0, marking: false, busy: false };
  paintChatBadge();
}
function paintChatBadge() {
  const a = document.querySelector('a[data-tab="chats"]'); if (!a) return;
  let b = a.querySelector('.cbd'); const n = CH.unread + CH.due.length;
  if (!n) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('span'); b.className = 'cbd'; a.appendChild(b); }
  b.textContent = n > 99 ? '99+' : n; b.title = CH.unread + ' ' + ct('unreadT') + (CH.due.length ? ', ' + CH.due.length + ' ' + ct('overdue') : '');
}
function chatsChanged() {
  CH.unread = CH.list.reduce((s, c) => s + (+c.unreadAdmin || 0), 0); paintChatBadge();
  if (tab !== 'chats' || !$('#cList')) return;
  drawRetention(); drawList(); drawThreadHead();
}

/* ---------- helpers ---------- */
const chatById = id => CH.list.find(c => c.id === id) || CH.due.find(c => c.id === id);
const tms = v => (v && v.toMillis ? v.toMillis() : (v ? +new Date(v) : 0));
function ago(ms) {
  if (!ms) return ''; const d = new Date(ms), n = new Date(), p = x => String(x).padStart(2, '0');
  if (d.toDateString() === n.toDateString()) return p(d.getHours()) + ':' + p(d.getMinutes());
  return d.getDate() + ' ' + t('mon')[d.getMonth()];
}
async function wipeChat(id) {         // messages first (batches of 400), then the thread; the cleanupDeletedChat function removes anything left
  for (let i = 0; i < 200; i++) {
    const s = await getDocs(query(collection(db, 'chats', id, 'messages'), limit(400)));
    if (s.empty) break;
    const b = writeBatch(db); s.docs.forEach(d => b.delete(d.ref)); await b.commit();
    if (s.size < 400) break;
  }
  await deleteDoc(doc(db, 'chats', id));
  logAct('chatDel');
  if (CH.sel === id) { CH.sel = ''; if (CH.unsubMsgs) CH.unsubMsgs(); CH.unsubMsgs = null; CH.msgs = []; }
}
async function extendChat(id) {
  const c = chatById(id); if (!c) return;
  const base = Math.max(Date.now(), tms(c.deletionScheduledAt));
  await updateDoc(doc(db, 'chats', id), { deletionScheduledAt: Timestamp.fromMillis(base + H72), extensionCount: increment(1), deletionPromptedAt: deleteField() });
  logAct('chatExt');
}
async function guarded(fn, msgId) {
  if (CH.busy) return; CH.busy = true;
  try { await fn(); if (msgId) setMsg(msgId, ct('done'), 'ok'); } catch (e) { console.warn(e); if (msgId) setMsg(msgId, ct('fail') + ((e && e.code) || (e && e.message) || ''), 'err'); }
  finally { CH.busy = false; chatsChanged(); }
}
async function retentionAct(id, act) {
  if (!confirm(act === 'confirm' ? ct('askDel') : ct('askExt'))) return;
  await guarded(() => act === 'confirm' ? wipeChat(id) : extendChat(id), 'cRetMsg');
}
function applyDeep() {
  if (!DEEP) return; const o = DEEP; DEEP = null; try { sessionStorage.removeItem('rgce_chat_deep'); } catch (x) {}
  if (o.chat) selectChat(o.chat);
  if (o.chat && (o.act === 'confirm' || o.act === 'extend') && CH.due.some(c => c.id === o.chat)) setTimeout(() => retentionAct(o.chat, o.act), 400);
}

/* ---------- push alerts (token is created inside admin-push.html because this page has IndexedDB switched off) ---------- */
async function enablePush() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) return setMsg('cPushMsg', ct('pushNo'), 'err');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') return setMsg('cPushMsg', ct('pushDeny'), 'err');
  const fr = document.createElement('iframe'); fr.style.display = 'none'; fr.src = BASE + 'admin-push.html'; fr.setAttribute('aria-hidden', 'true');
  const onMsg = async e => {
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.type === 'rgce-push-ready') fr.contentWindow.postMessage({ type: 'rgce-push-go' }, location.origin);
    else if (e.data.type === 'rgce-push') {
      removeEventListener('message', onMsg); setTimeout(() => fr.remove(), 500);
      if (e.data.error === 'no-vapid') return setMsg('cPushMsg', ct('pushVapid'), 'err');
      if (e.data.error) return setMsg('cPushMsg', ct('pushErr') + e.data.error, 'err');
      try { await setDoc(doc(db, 'admin_push_tokens', e.data.token), { uid: user.uid, updatedAt: serverTimestamp(), ua: String(navigator.userAgent).slice(0, 120) }); setMsg('cPushMsg', ct('pushOn'), 'ok'); }
      catch (x) { setMsg('cPushMsg', ct('pushErr') + ((x && x.code) || ''), 'err'); }
    }
  };
  addEventListener('message', onMsg); document.body.appendChild(fr);
}
try { navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', e => {      // notification clicked while the panel is already open
  if (e.data && e.data.type === 'rgce-open') { try { const u = new URL(e.data.url, location.origin), p = u.searchParams; DEEP = { chat: p.get('chat') || '', act: p.get('act') || '', review: p.get('review') || '' }; if (tab !== 'chats') goTab('chats'); else applyDeep(); } catch (x) {} }
}); } catch (x) {}

    '.cht-item{text-align:left;width:100%;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 11px;cursor:pointer;font:inherit}' +

    '.cht-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.cht-head small{display:block;color:var(--muted)}' +
    '.cht-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}' +
    '.cht-m{max-width:78%;padding:8px 11px;border-radius:14px;background:var(--panel);border:1px solid var(--border);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}' +

  document.head.appendChild(s);
}
function tabChats() {
  chatStyle();
  $('#tabBody').innerHTML = '<div class="card cht-ret" id="cRet" hidden></div>'
    + '<div class="cht-wrap' + (CH.sel ? ' sel' : '') + '" id="cWrap"><div class="card cht-list"><h2 style="margin:0">' + esc(ct('h')) + '</h2>'
    + '<div class="fg" style="margin-top:10px"><input id="cQ" type="search" autocomplete="off" placeholder="' + esc(ct('search')) + '" aria-label="' + esc(ct('search')) + '" value="' + esc(CH.q) + '"></div>'
    + '<div style="margin-top:8px"><button class="btn btn-sm" id="cPush" type="button">' + esc(ct('push')) + '</button></div><div class="msg" id="cPushMsg" role="status"></div>'
    + '<div class="cht-items" id="cList"></div></div>'
    + '<div class="card cht-thread" id="cThread"></div></div>'
    + '<div class="card" id="cPurge" style="margin-top:16px"><h2>' + esc(ct('pgH')) + '</h2><p class="muted">' + esc(ct('pgP')) + '</p>'
    + '<div style="display:flex;flex-wrap:wrap;gap:12px;margin:10px 0"><label class="fg" style="margin:0">' + esc(ct('from')) + '<input type="date" id="pgFrom"></label><label class="fg" style="margin:0">' + esc(ct('to')) + '<input type="date" id="pgTo"></label></div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn btn-sm" id="pgCount" type="button">' + esc(ct('pgCount')) + '</button><button class="btn btn-sm btn-danger" id="pgDel" type="button">' + esc(ct('pgDel')) + '</button></div><div class="msg" id="pgMsg" role="status"></div></div>';
  $('#cQ').addEventListener('input', e => { CH.q = e.target.value; drawList(); });
  $('#cPush').addEventListener('click', enablePush);
  $('#cList').addEventListener('click', e => { const b = e.target.closest('[data-chat]'); if (b) selectChat(b.getAttribute('data-chat')); });
  $('#pgCount').addEventListener('click', () => purge(false));
  $('#pgDel').addEventListener('click', () => purge(true));
  drawRetention(); drawList(); drawThread();
  applyDeep();
}
function drawRetention() {
  const box = $('#cRet'); if (!box) return;
  if (!CH.due.length) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.innerHTML = '<h2 style="margin-top:0">' + esc(ct('retH')) + ' (' + CH.due.length + ')</h2><p class="muted">' + esc(ct('retP')) + '</p>'
    + CH.due.map(c => '<div class="row"><div><b>' + esc(c.customerName || '-') + '</b> <span class="muted">' + esc(c.contactNumber || '') + ' \u2022 ' + esc(fmtDT(c.deletionScheduledAt)) + ' \u2022 ' + esc(ct('ext')) + ' ' + (+c.extensionCount || 0) + ' ' + esc(ct('times')) + '</span></div>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-sm btn-danger" data-ra="confirm" data-id="' + esc(c.id) + '" type="button">' + esc(ct('retDel')) + '</button><button class="btn btn-sm" data-ra="extend" data-id="' + esc(c.id) + '" type="button">' + esc(ct('retExt')) + '</button></div></div>').join('')
    + '<div class="row" style="justify-content:flex-end;gap:8px"><button class="btn btn-sm btn-danger" id="raDelAll" type="button">' + esc(ct('retDelAll')) + '</button><button class="btn btn-sm" id="raExtAll" type="button">' + esc(ct('retExtAll')) + '</button></div><div class="msg" id="cRetMsg" role="status"></div>';
  box.querySelectorAll('[data-ra]').forEach(b => b.addEventListener('click', () => retentionAct(b.getAttribute('data-id'), b.getAttribute('data-ra'))));
  $('#raDelAll').addEventListener('click', () => { if (confirm(ct('askDelAll'))) guarded(async () => { for (const c of CH.due.slice()) await wipeChat(c.id); }, 'cRetMsg'); });
  $('#raExtAll').addEventListener('click', () => { if (confirm(ct('askExtAll'))) guarded(async () => { for (const c of CH.due.slice()) await extendChat(c.id); }, 'cRetMsg'); });
}
function drawList() {
  const box = $('#cList'); if (!box) return;
  if (CH.err) { box.innerHTML = '<p class="muted">' + esc(ct('loadErr') + CH.err + ct('loadErr2')) + '</p>'; return; }
  const w = CH.q.toLowerCase().split(/\s+/).filter(Boolean);
  const rows = CH.list.filter(c => w.every(x => (String(c.customerName || '') + ' ' + (c.contactNumber || '') + ' ' + (c.lastMessage || '')).toLowerCase().indexOf(x) >= 0));
  if (!rows.length) { box.innerHTML = '<p class="muted">' + esc(CH.list.length ? ct('noMatch') : ct('none')) + '</p>'; return; }
  const now = Date.now();
  box.innerHTML = rows.map(c => {
    const left = Math.ceil((tms(c.deletionScheduledAt) - now) / 86400000), u = +c.unreadAdmin || 0;
    return '<button type="button" class="cht-item' + (c.id === CH.sel ? ' on' : '') + '" data-chat="' + esc(c.id) + '"><b><span>' + esc(c.customerName || '-') + '</span><span>' + (u ? '<span class="u">' + u + '</span> ' : '') + '<small style="display:inline">' + esc(ago(tms(c.lastActivity))) + '</small></span></b>'
      + '<small>' + esc(c.contactNumber || '') + ' \u2022 ' + (left <= 0 ? '<span class="od">' + esc(ct('overdue')) + '</span>' : left + ' ' + esc(ct('left'))) + '</small><small>' + esc((c.lastSender === 'admin' ? ct('you') + ': ' : '') + (c.lastMessage || '')) + '</small></button>';
  }).join('');
}
function selectChat(id) {
  if (!id) return; CH.sel = id; CH.msgs = [];
  if (CH.unsubMsgs) CH.unsubMsgs();
  CH.unsubMsgs = onSnapshot(query(collection(db, 'chats', id, 'messages'), orderBy('timestamp', 'asc'), limit(500)), snap => {
    CH.msgs = snap.docs.map(d => Object.assign({ id: d.id, ts: tms(d.data({ serverTimestamps: 'estimate' }).timestamp) }, d.data({ serverTimestamps: 'estimate' })));
    drawMsgs(); markRead();
  }, e => console.warn('msgs', e));
  const w = $('#cWrap'); if (w) w.classList.add('sel');
  drawList(); drawThread();
}
function drawThread() {
  const th = $('#cThread'); if (!th) return;
  if (!CH.sel) { th.innerHTML = '<div class="cht-msgs" style="align-items:center;justify-content:center"><p class="muted">' + esc(ct('pick')) + '</p></div>'; return; }
  th.innerHTML = '<div class="cht-head" id="cHead"></div><div class="cht-msgs" id="cMsgs" aria-live="polite"></div>'
    + '<div class="cht-send"><textarea id="cTx" rows="1" maxlength="1000" placeholder="' + esc(ct('ph')) + '" aria-label="' + esc(ct('ph')) + '"></textarea><button class="btn" id="cSend" type="button">' + esc(ct('send')) + '</button></div>';
  $('#cSend').addEventListener('click', sendReply);
  $('#cTx').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); } });
  drawThreadHead(); drawMsgs();
}
function drawThreadHead() {
  const h = $('#cHead'); if (!h) return; const c = chatById(CH.sel);
  if (!c) { CH.sel = ''; drawThread(); const w = $('#cWrap'); if (w) w.classList.remove('sel'); return; }
  h.innerHTML = '<div><button class="btn btn-sm cht-back" id="cBack" type="button">\u2190 ' + esc(ct('back')) + '</button> <b>' + esc(c.customerName || '-') + '</b> <span class="muted">' + esc(c.contactNumber || '') + '</span>'
    + '<small>' + esc(ct('created')) + ': ' + esc(fmtDT(c.createdAt)) + ' \u2022 ' + esc(ct('delAt')) + ': ' + esc(fmtDT(c.deletionScheduledAt)) + ' \u2022 ' + esc(ct('ext')) + ' ' + (+c.extensionCount || 0) + ' ' + esc(ct('times')) + '</small></div>'
    + '<div style="display:flex;gap:6px"><button class="btn btn-sm" id="cExt" type="button">' + esc(ct('extBtn')) + '</button><button class="btn btn-sm btn-danger" id="cDel" type="button">' + esc(ct('delBtn')) + '</button></div>';
  $('#cBack').addEventListener('click', () => { const w = $('#cWrap'); if (w) w.classList.remove('sel'); });
  $('#cExt').addEventListener('click', () => { if (confirm(ct('askExt'))) guarded(() => extendChat(c.id)); });
  $('#cDel').addEventListener('click', () => { if (confirm(ct('askDel'))) guarded(() => wipeChat(c.id)); });
}
function drawMsgs() {
  const b = $('#cMsgs'); if (!b) return; const near = b.scrollHeight - b.scrollTop - b.clientHeight < 90; b.textContent = '';
  CH.msgs.forEach(m => {
    const d = document.createElement('div'); d.className = 'cht-m' + (m.senderType === 'admin' ? ' a' : ''); d.appendChild(document.createTextNode(m.text));
    const s = document.createElement('small'); s.textContent = ago(m.ts) + (m.senderType === 'admin' ? '  ' + (m.readStatus === 'read' ? '\u2713\u2713 ' + ct('seen') : '\u2713 ' + ct('sent')) : '');
    d.appendChild(s); b.appendChild(d);
  });
  if (near || !b.dataset.init) { b.scrollTop = b.scrollHeight; b.dataset.init = '1'; }
}
async function sendReply() {
  const tx = $('#cTx'); if (!tx || !CH.sel) return; const text = tx.value.trim().slice(0, 1000); if (!text) return; tx.value = '';
  try {
    const ref = doc(collection(db, 'chats', CH.sel, 'messages')), b = writeBatch(db);
    b.set(ref, { messageId: ref.id, senderId: user.uid, senderType: 'admin', text, timestamp: serverTimestamp(), readStatus: 'sent' });
    b.update(doc(db, 'chats', CH.sel), { lastActivity: serverTimestamp(), lastMessage: text.slice(0, 120), lastSender: 'admin', unreadCustomer: increment(1) });
    await b.commit(); const m = $('#cMsgs'); if (m) m.scrollTop = m.scrollHeight;
  } catch (e) { console.warn(e); tx.value = text; alert(ct('fail') + ((e && e.code) || '')); }
}
async function markRead() {                       // read receipts: customer messages become "read" once the thread is open on screen
  if (CH.marking || !CH.sel || document.hidden) return;
  const un = CH.msgs.filter(m => m.senderType === 'customer' && m.readStatus !== 'read'), c = chatById(CH.sel);
  if (!un.length && !(c && c.unreadAdmin > 0)) return;
  CH.marking = true;
  try { const b = writeBatch(db); un.slice(0, 400).forEach(m => b.update(doc(db, 'chats', CH.sel, 'messages', m.id), { readStatus: 'read' })); b.update(doc(db, 'chats', CH.sel), { unreadAdmin: 0 }); await b.commit(); }
  catch (e) { console.warn('markRead', e); } finally { CH.marking = false; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && tab === 'chats') markRead(); });

/* ---------- manual purge by date range ---------- */
async function purge(doDelete) {
  const f = $('#pgFrom').value, to = $('#pgTo').value;
  if (!f && !to) return setMsg('pgMsg', ct('pgNeed'), 'err');
  const build = () => { const c = []; if (f) c.push(where('lastActivity', '>=', Timestamp.fromDate(new Date(f + 'T00:00:00')))); if (to) c.push(where('lastActivity', '<=', Timestamp.fromDate(new Date(to + 'T23:59:59.999')))); return query(collection(db, 'chats'), ...c, orderBy('lastActivity'), limit(500)); };
  if (CH.busy) return; CH.busy = true; setMsg('pgMsg', '');
  try {
    let s = await getDocs(build()), n = s.size, more = s.size === 500;
    if (!doDelete) { setMsg('pgMsg', ct('pgFound').replace('{n}', n + (more ? '+' : '')), 'ok'); return; }
    if (!n) { setMsg('pgMsg', ct('pgFound').replace('{n}', 0), 'ok'); return; }
    if (!confirm(ct('pgAsk').replace('{n}', n + (more ? '+' : '')))) return;
    let total = 0;
    for (let round = 0; round < 40 && !s.empty; round++) {
      for (const d of s.docs) { await wipeChat(d.id); total++; }
      s = s.size === 500 ? await getDocs(build()) : { empty: true };
    }
    setMsg('pgMsg', ct('pgDone').replace('{n}', total), 'ok');
  } catch (e) { console.warn(e); setMsg('pgMsg', ct('fail') + ((e && e.code) || (e && e.message) || ''), 'err'); }
  finally { CH.busy = false; chatsChanged(); }
}

/* ============ start ============ */
onAuthStateChanged(auth, u => {
  booted = true; window.__rgceBooted = true; try { sessionStorage.removeItem('rgce_adm_try'); sessionStorage.removeItem('rgce_adm_heal'); } catch (x) {}
  const changed = (u && u.uid) !== (user && user.uid);
  user = u || null;
  unlocked = !!(user && sessGet('rgce_adm_ok') === user.uid);
  if (!user) sessDel('rgce_adm_ok');
  if (!user) { N = { list: [], on: false, editing: '', pubErr: false, loaded: false }; render(); }
  else if (changed) openPanel();
  else render();
});
